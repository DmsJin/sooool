[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "touhou-kaguya-gym"
version = "0.1.0"
description = "Deterministic simplified Kaguya bullet-hell with a browser frontend and Gymnasium API"
requires-python = ">=3.10"
dependencies = ["gymnasium>=1.0,<2", "numpy>=1.24"]
[tool.setuptools.packages.find]
where = ["python"]
[tool.setuptools.package-data]
touhou_gym = ["engine/*.mjs"]
