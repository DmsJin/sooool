[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dfjk-rhythm-gym"
version = "0.1.0"
description = "Deterministic four-lane rhythm Gymnasium environment"
requires-python = ">=3.10"
dependencies = ["gymnasium>=1.0,<2", "numpy>=1.24"]
[tool.setuptools.package-data]
rhythm_gym = ["chart.json"]

[project.optional-dependencies]
research = ["playwright>=1.40", "httpx>=0.27", "Pillow>=10"]

[tool.setuptools.packages.find]
include = ["rhythm_gym*"]
